<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmoniq</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div class="header-row">
            <div class="brand">
                <img src="harmoniq-logo.png" alt="Harmoniq logo" id="logo">
                <h1>Harmoniq</h1>
            </div>
            <button type="button" id="themeToggle">Dark mode</button>
        </div>
        <p class="tagline">Study smarter, feel better.</p>

        <form id="harmoniqForm">

            <!-- ============================================
                 SESSION TYPE TOGGLE
                 Normal: existing summary/flashcards/questions flow
                 Exam: adds exam date + scored quiz with weak-area detection
                 ============================================ -->
            <div class="form-group">
                <label>Session Type:</label>
                <div class="session-type-group">
                    <button type="button" class="sessionTypeBtn selected" data-type="normal">Normal Study</button>
                    <button type="button" class="sessionTypeBtn" data-type="exam">Exam Prep</button>
                </div>
            </div>

            <div class="form-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" placeholder="e.g. Introduction to Databases">
            </div>

            <div class="form-group">
                <label for="academicLevel">Academic Level:</label>
                <select id="academicLevel">
                    <option value="">Select level</option>
                    <option value="Secondary">Secondary</option>
                    <option value="Pre-university">Pre-university</option>
                    <option value="Undergraduate">Undergraduate</option>
                    <option value="Postgraduate">Postgraduate</option>
                </select>
            </div>

            <div class="form-group">
                <label for="prepLevel">Preparation Level:</label>
                <select id="prepLevel">
                    <option value="">Select level</option>
                    <option value="First time seeing it">First time seeing it</option>
                    <option value="Read once">Read once</option>
                    <option value="Read a few times">Read a few times</option>
                    <option value="Very familiar">Very familiar</option>
                </select>
            </div>

            <!-- ============================================
                 EXAM DATE — only shown and required when
                 Session Type is set to "Exam Prep"
                 ============================================ -->
            <div class="form-group" id="examDateGroup" style="display:none;">
                <label for="examDate">Exam Date:</label>
                <input type="date" id="examDate">
            </div>

            <div class="form-group">
                <label for="notes">Your Notes:</label>
                <textarea id="notes" rows="10" placeholder="Paste your notes here (maximum 3,000 words)"></textarea>
                <p id="wordCount">0 / 3,000 words</p>
            </div>

            <p id="formError"></p>
            <button type="button" id="generateBtn">Generate Study Materials</button>
        </form>

        <div id="output" style="display:none;">
            <div id="grounding"></div>
            <div id="summary"></div>
            <div id="flashcards"></div>
            <div id="questions"></div>
        </div>

        <div id="modalOverlay" style="display:none;">
            <div id="modal">
                <p id="modalMessage">Before we begin — how are you feeling right now?</p>
                <p id="modalSubtext">Harmoniq adjusts your study materials based on how you're feeling, because how you arrive matters as much as what you're studying.</p>
                <div id="modalOptions">
                    <button type="button" class="stateBtn" data-state="Ready">Ready</button>
                    <button type="button" class="stateBtn" data-state="Distracted">A bit distracted</button>
                    <button type="button" class="stateBtn" data-state="Overwhelmed">Overwhelmed</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
